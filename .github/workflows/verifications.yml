name: Vérifications

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        better-auth: ["1.6.15", "1.6.33"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun add -d better-auth@${{ matrix.better-auth }}
      - run: bunx vitest run
      - name: Le dossier dist est à jour
        if: matrix.better-auth == '1.6.33'
        run: |
          git checkout -- package.json bun.lock
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          git diff --exit-code -- dist
